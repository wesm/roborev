components:
  schemas:
    ActivityEntry:
      additionalProperties: false
      properties:
        component:
          type: string
        details:
          additionalProperties:
            type: string
          type: object
        event:
          type: string
        message:
          type: string
        ts:
          format: date-time
          type: string
      required:
        - ts
        - event
        - component
        - message
      type: object
    ActivityOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ActivityOutputBody.json
          format: uri
          readOnly: true
          type: string
        entries:
          items:
            $ref: "#/components/schemas/ActivityEntry"
          type: array
      required:
        - entries
      type: object
    AddCommentRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/AddCommentRequest.json
          format: uri
          readOnly: true
          type: string
        comment:
          type: string
        commenter:
          type: string
        job_id:
          format: int64
          type: integer
        sha:
          type: string
      required:
        - commenter
        - comment
      type: object
    AgentHookSnooze:
      additionalProperties: false
      properties:
        branch:
          type: string
        repo_name:
          type: string
        repo_path:
          type: string
        snoozed_until:
          format: date-time
          type: string
        worktree_path:
          type: string
      required:
        - repo_name
        - repo_path
        - worktree_path
        - branch
        - snoozed_until
      type: object
    AgentHookSnoozeOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/AgentHookSnoozeOutputBody.json
          format: uri
          readOnly: true
          type: string
        snoozed:
          type: boolean
        snoozed_until:
          format: date-time
          type: string
      required:
        - snoozed
      type: object
    AgentHookSnoozeRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/AgentHookSnoozeRequest.json
          format: uri
          readOnly: true
          type: string
        branch:
          type: string
        enabled:
          type: boolean
        repo_path:
          type: string
        snoozed_until:
          format: date-time
          type: string
        worktree_path:
          type: string
      required:
        - repo_path
        - worktree_path
        - enabled
      type: object
    AgentStats:
      additionalProperties: false
      properties:
        agent:
          type: string
        errors:
          format: int64
          type: integer
        failed:
          format: int64
          type: integer
        median_duration_secs:
          format: double
          type: number
        pass_rate:
          format: double
          type: number
        passed:
          format: int64
          type: integer
        total:
          format: int64
          type: integer
      required:
        - agent
        - total
        - passed
        - failed
        - errors
        - pass_rate
        - median_duration_secs
      type: object
    AnalyticsAttemptStats:
      additionalProperties: false
      properties:
        duration:
          $ref: "#/components/schemas/AnalyticsPercentiles"
        eligible:
          format: int64
          type: integer
      required:
        - eligible
        - duration
      type: object
    AnalyticsCostStats:
      additionalProperties: false
      properties:
        complete:
          type: boolean
        coverage:
          format: double
          type: number
        eligible_attempts:
          format: int64
          type: integer
        priced_attempts:
          format: int64
          type: integer
        total_usd:
          format: double
          type: number
      required:
        - total_usd
        - eligible_attempts
        - priced_attempts
        - coverage
        - complete
      type: object
    AnalyticsDimensionRow:
      additionalProperties: false
      properties:
        attempts:
