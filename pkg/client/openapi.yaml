info:
  title: roborev
  version: dev
openapi: 3.1.0
paths:
  /api/activity:
    get:
      operationId: list-activity
      parameters:
        - description: Maximum entries to return
          explode: false
          in: query
          name: limit
          schema:
            description: Maximum entries to return
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List recent daemon activity
      tags:
        - daemon
  /api/agent-hook/snooze:
    post:
      operationId: set-agent-hook-snooze
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentHookSnoozeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHookSnoozeOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Set or clear an agent-hook workspace snooze
      tags:
        - agent-hook
  /api/branches:
    get:
      operationId: list-branches
      parameters:
        - description: Filter to branches in these repo paths
          explode: true
          in: query
          name: repo
          schema:
            description: Filter to branches in these repo paths
            items:
              type: string
            type: array
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBranchesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List branches with job counts
      tags:
        - repos
  /api/comment:
    post:
      operationId: add-comment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCommentRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Add a comment to a job or commit
      tags:
        - comments
  /api/comments:
    get:
      operationId: list-comments
      parameters:
        - description: List comments by job ID
          explode: false
          in: query
          name: job_id
          schema:
            default: -1
            description: List comments by job ID
            format: int64
            type: integer
        - description: List comments by commit ID
          explode: false
          in: query
          name: commit_id
          schema:
            default: -1
            description: List comments by commit ID
            format: int64
            type: integer
        - description: List comments by commit SHA
          explode: false
          in: query
          name: sha
          schema:
            description: List comments by commit SHA
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCommentsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List comments for a job or commit
      tags:
        - comments
  /api/cost:
    get:
      operationId: get-cost
      parameters:
        - description: Repo root paths (repeatable)
          explode: true
          in: query
          name: repo
          schema:
            description: Repo root paths (repeatable)
            items:
              type: string
            type: array
        - description: Filter by branch name
          explode: false
          in: query
          name: branch
          schema:
            description: Filter by branch name
            type: string
        - description: Only jobs with empty/unset branch
          explode: false
          in: query
          name: branch_empty
          schema:
            description: Only jobs with empty/unset branch
            enum:
              - "true"
              - "false"
            type: string
        - description: Time window (e.g. 7d); default all-time
          explode: false
          in: query
          name: since
          schema:
            description: Time window (e.g. 7d); default all-time
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostAggregate"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get aggregate review cost
      tags:
        - daemon
  /api/enqueue:
    post:
      operationId: enqueue-job
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnqueueRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/EnqueueCreatedResponse"
                  - $ref: "#/components/schemas/PanelEnqueueResponse"
                  - $ref: "#/components/schemas/EnqueueSkippedResponse"
          description: HTTP 200 response
        "201":
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/EnqueueCreatedResponse"
                  - $ref: "#/components/schemas/PanelEnqueueResponse"
                  - $ref: "#/components/schemas/EnqueueSkippedResponse"
          description: HTTP 201 response
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: HTTP 400 response
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: HTTP 413 response
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: HTTP 500 response
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: HTTP 503 response
      summary: Enqueue a daemon job
      tags:
        - jobs
  /api/export/ci-costs:
    get:
      operationId: export-ci-costs
      parameters:
        - description: Output format; only json is supported
          explode: false
          in: query
          name: format
          schema:
            default: json
