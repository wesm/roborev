            type: string
          type: array
        models:
          items:
            type: string
          type: array
        projects:
          items:
            type: string
          type: array
        sources:
          items:
            type: string
          type: array
      required:
        - projects
        - sources
        - agents
        - models
      type: object
    AnalyticsFilters:
      additionalProperties: false
